# Deploys fantasyfootballdraftorder.com: infra first (Pulumi), then the app to
# Cloudflare Workers via OpenNext.
#
# There are NO runtime secrets to push. The database is a D1 binding, so there
# is no DATABASE_URL, and the app has no third-party API keys — hence no
# `wrangler secret bulk` step at all. Everything non-secret is hardcoded in
# wrangler.jsonc.
#
# The `infra` job runs the Cloudflare Pulumi program in `program/` (Web
# Analytics, WAF scanner block, email routing) before the app builds, so the
# app job can assume the zone is configured.
#
# Auth uses the Cloudflare credentials fanned out to every repo:
#   - secret CLOUDFLARE_API_TOKEN  (scopes: Workers Scripts:Edit, D1:Edit,
#                                   Workers R2 Storage:Edit, Zone:Edit)
#   - variable CLOUDFLARE_ACCOUNT_ID
# Pulumi state + auth secrets (CLOUDFLARE_S3_*, PULUMI_CONFIG_PASSPHRASE,
# INFRA_INSTALL_TOKEN) live in the reusable workflow's `secrets: inherit`.
# See docs/DEPLOY.md.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "program/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  # Inlined from Parra-Inc/cloudflare-infra/.github/workflows/pulumi.yml, which
  # every other project repo calls as a reusable workflow.
  #
  # This repo cannot: it is PUBLIC and cloudflare-infra is PRIVATE, and a public
  # repo may not call a reusable workflow from a private one. That is a hard
  # GitHub rule, not a permissions setting - cloudflare-infra already has
  # actions/permissions/access set to `organization` and it makes no difference.
  # The whole run fails to even start, at 0s, with "workflow file issue" and no
  # jobs created, which is a confusing way to learn this.
  #
  # So this is a copy, and copies drift. If the shared workflow changes, this
  # needs the same change by hand. The alternative to a copy is making
  # cloudflare-infra public, which is worse.
  infra:
    name: Infra (Pulumi)
    runs-on: ubuntu-latest
    # Serialize so two runs never touch the same state key at once.
    concurrency:
      group: pulumi-${{ github.repository }}-prod
      cancel-in-progress: false
    env:
      # R2 (S3-compatible) state backend credentials.
      AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      # Cloudflare provider auth. Web Analytics / RUM has no granular token
      # permission at all, so that component calls the REST API directly with
      # Global API Key auth instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      # PAT for installing private @parra/* packages. Hoisted to env so a step
      # can test it: the `secrets` context is not valid in `if:`.
      INFRA_INSTALL_TOKEN: ${{ secrets.INFRA_INSTALL_TOKEN }}
    steps:
      # persist-credentials:false stops checkout leaving a repo-scoped token in
      # this checkout's git config. npm runs inside the checkout, so that token
      # would otherwise be sent when cloning the private @parra package and 404
      # it, since a repo token cannot see other repos.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rewrite https, git@ and ssh forms to tokenized https, since npm may
      # resolve github:/git+ssh specs to any of them.
      - name: Configure git for private npm installs
        run: |
          if [ -z "${INFRA_INSTALL_TOKEN}" ]; then
            echo "INFRA_INSTALL_TOKEN is EMPTY - private installs will fail"
          else
            echo "INFRA_INSTALL_TOKEN is set (length ${#INFRA_INSTALL_TOKEN})"
          fi
          base="https://x-access-token:${INFRA_INSTALL_TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        working-directory: program
        run: npm install

      # Self-managed (R2) backends do not auto-create stacks. Create it on the
      # first run; a no-op once it exists.
      - name: Ensure stack exists
        working-directory: program
        run: |
          curl -fsSL https://get.pulumi.com | sh
          export PATH="$HOME/.pulumi/bin:$PATH"
          pulumi login "s3://${{ vars.PULUMI_STATE_BUCKET }}?endpoint=${{ vars.R2_ENDPOINT_HOST }}&s3ForcePathStyle=true&region=auto"
          pulumi stack select prod 2>/dev/null || pulumi stack init prod

      - name: Pulumi preview (PR)
        if: github.event_name == 'pull_request'
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: prod
          work-dir: program
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}?endpoint=${{ vars.R2_ENDPOINT_HOST }}&s3ForcePathStyle=true&region=auto
          comment-on-pr: true

      - name: Pulumi up (main)
        if: github.event_name != 'pull_request'
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: prod
          work-dir: program
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}?endpoint=${{ vars.R2_ENDPOINT_HOST }}&s3ForcePathStyle=true&region=auto

  deploy:
    name: Build and deploy to Cloudflare
    needs: infra
    # Only ship the app on push to main / manual dispatch - pull_request runs
    # exist solely to preview the Pulumi diff.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # NEXT_PUBLIC_* is inlined at build time; keep these in sync with the
      # `vars` block in wrangler.jsonc.
      NEXT_PUBLIC_BASE_URL: https://fantasyfootballdraftorder.com
      # Powers the "randomizer at this exact commit" link on every results page
      # (src/lib/env.ts -> commitSha). Only known at build time, hence here.
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        # The randomizer is the product's trust story. It is pure and fast, so
        # gate the deploy on it rather than running a separate workflow.
        run: pnpm test

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build (Next.js + OpenNext via turbo)
        run: pnpm exec turbo run build:cf

      # Resolve D1 to an explicit id BEFORE `wrangler deploy`, so deploy never
      # auto-creates anything. Auto-provisioning by binding name alone is
      # unreliable: a deploy that dies after the database is created (e.g. the
      # worker fails size validation) leaves it orphaned, and every retry then
      # re-attempts create() and fails with "already exists". So: look up
      # first, create only if missing, then substitute the id.
      # Committing the real id in wrangler.jsonc makes this a no-op.
      - name: Provision D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB=fantasy-draft-order-db-production
          if grep -q REPLACE_WITH_D1_ID wrangler.jsonc; then
            pnpm exec wrangler d1 info "$DB" >/dev/null 2>&1 \
              || pnpm exec wrangler d1 create "$DB"
            D1_ID=$(pnpm exec wrangler d1 info "$DB" --json | jq -r '.uuid')
            if [ -z "$D1_ID" ] || [ "$D1_ID" = "null" ]; then
              echo "Could not resolve D1 id for $DB" >&2
              exit 1
            fi
            sed -i "s/REPLACE_WITH_D1_ID/$D1_ID/" wrangler.jsonc
            echo "Using D1 $D1_ID (commit it to wrangler.jsonc to skip this lookup)"
          fi

      # Replay every migration into an empty local database and check that the
      # result matches prisma/schema. Migrations here are usually generated by
      # `prisma migrate diff`, but sometimes hand-written: SQLite's ALTER TABLE
      # is limited enough that the generated table rebuild is not always what
      # you want (see 0002_draft_attribution.sql). A hand-written migration
      # that drifts from the schema is invisible locally, because the local
      # database was migrated by the same hand-written SQL and looks correct.
      #
      # --local needs no credentials and touches nothing remote. Running it
      # here, one step before the remote apply, means a bad migration fails the
      # deploy instead of half-applying to production.
      - name: Validate migrations against the schema
        run: |
          pnpm exec wrangler d1 migrations apply \
            fantasy-draft-order-db-production --local
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema ./prisma/schema \
            --script \
            --exit-code \
          || {
            echo "::error::prisma/migrations does not add up to prisma/schema."
            echo "::error::The SQL above is the difference. Fold it into a new"
            echo "::error::migration (pnpm db:migrate:new) or fix the drift."
            exit 1
          }

      # Migrate before deploying, so the new code never meets a table that does
      # not exist yet. Prisma Migrate does not drive D1: the SQL in
      # prisma/migrations is generated by `pnpm db:migrate:new` and applied
      # here. wrangler tracks what it has already run in the d1_migrations
      # table, so this is idempotent.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 migrations apply \
            fantasy-draft-order-db-production --remote

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
